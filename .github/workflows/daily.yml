name: 每日机选号码邮件推送

# 触发：每天北京时间 20:00（UTC 12:00）自动运行；也可在 Actions 页面手动触发
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch: {}

# 允许把保存的推荐号码（picks-history.json）提交回仓库
permissions:
  contents: write

# 与「开奖核对」工作流共用一把锁：两者都会改 picks-history.json，串行执行避免互相覆盖
concurrency:
  group: picks-history
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    # 所有邮箱相关配置均来自仓库 Secrets（Settings → Secrets and variables → Actions）
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_TO: ${{ secrets.SMTP_TO }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm install

      - name: 发送机选号码邮件并保存推荐号码（5 注双色球 + 5 注大乐透）
        run: node scripts/send-picks.js

      - name: 提交保存的推荐号码（push 失败自动 rebase 重试）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add picks-history.json
          if git diff --cached --quiet; then
            echo "没有需要提交的推荐号码变更。"
          else
            git commit -m "chore: 保存每日推荐号码 [skip ci]"
            for i in 1 2 3; do
              if git push; then
                echo "push 成功（第 $i 次尝试）"
                exit 0
              fi
              echo "push 失败（第 $i 次），rebase 远端后重试..."
              git pull --rebase origin main || git rebase --abort
            done
            echo "连续 3 次 push 失败，放弃。"
            exit 1
          fi

# 说明：官方开奖数据刷新（fetch-official.js）依赖中彩网/500彩票，仅国内 IP 可访问，
# GitHub 境外服务器会被反爬（403），故不在云端刷新。数据刷新交给本机的定时任务处理。
# 机选邮件为纯随机生成，不依赖开奖数据，云端可正常发送。
