name: 每日机选号码邮件推送

# 触发：每天北京时间 20:00（UTC 12:00）自动运行；也可在 Actions 页面手动触发
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    # 发件/收件地址写死在此（非敏感）；只有 SMTP 授权码来自仓库 Secrets
    env:
      SMTP_HOST: smtp.qq.com
      SMTP_PORT: '465'
      SMTP_USER: '2584958160@qq.com'
      SMTP_FROM: '2584958160@qq.com'
      SMTP_TO: '951038180@qq.com'
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm install

      - name: 发送机选号码邮件（5 注双色球 + 5 注大乐透）
        run: node scripts/send-picks.js

# 说明：官方开奖数据刷新（fetch-official.js）依赖中彩网/500彩票，仅国内 IP 可访问，
# GitHub 境外服务器会被反爬（403），故不在云端刷新。数据刷新交给本机的定时任务处理。
# 机选邮件为纯随机生成，不依赖开奖数据，云端可正常发送。
